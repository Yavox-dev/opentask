# Services d'infrastructure pour le développement local.
# Redis et le worker seront ajoutés à l'itération 4 et 5.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opentask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opentask}
      POSTGRES_DB: ${POSTGRES_DB:-opentask}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opentask}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
